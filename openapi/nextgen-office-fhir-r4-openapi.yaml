        FHIR Resource: Location \n
        * Location \n"
      parameters:
        - $ref: "#/parameters/id"
      responses:
        '200':
          description: Success
          schema:
            $ref: "#/definitions/Practitioner"
        '404':
          $ref: "#/responses/ResourceNotFound404"
        '401':
          $ref: "#/responses/ResourceNotAuthorized401"
  "/fhir/r4/PractitionerRole/{id}":
    get:
      tags:
        - PractitionerRole
      description: "Fetches a Practitioner Role by id.  \n \n
        FHIR Resource: PractitionerRole \n
        *	Practitioner Role \n"
      parameters:
        - $ref: "#/parameters/id"
      responses:
        '200':
          description: Success
          schema:
            $ref: "#/definitions/PractitionerRole"
        '404':
          $ref: "#/responses/ResourceNotFound404"
        '401':
          $ref: "#/responses/ResourceNotAuthorized401"
  "/fhir/r4/PractitionerRole":
      get:
        tags:
          - PractitionerRole
        description: "Fetches a bundled resource containing practitioner role data based on the provided parameters.\n\n
              - If `practitioner_id` is provided, a bundle containing a practitioner role is returned.\n\n
          FHIR Resource: PractitionerRole \n
        *	Practitioner Role \n"
        parameters:
          - $ref: "#/parameters/practitioner_id"
        responses:
          '200':
            description: success
            schema:
              $ref: "#/definitions/PractitionerRoleBundled"
          '404':
            $ref: "#/responses/ResourceNotFound404"
          '401':
            $ref: "#/responses/ResourceNotAuthorized401"
  "/fhir/r4/Location/{id}":
    get:
      tags:
        - Location
      description: "Fetches Location by id. Details and position information for a physical place where services are provided and resources and participants may be stored, found, contained, or accommodated.  \n \n
        FHIR Resource: Location \n
        *	Location \n"
      parameters:
        - $ref: "#/parameters/id"
      responses:
        '200':
          description: Success
          schema:
            $ref: "#/definitions/Location"
        '404':
          $ref: "#/responses/ResourceNotFound404"
        '401':
          $ref: "#/responses/ResourceNotAuthorized401"
  "/fhir/r4/Organization/{id}":
    get:
      tags:
        - Organization
      description: "Fetches an Organization by id. Organization is a formally or informally recognized grouping of people or organizations formed for the purpose of achieving some form of collective action.  \n \n
        FHIR Resource: Organization \n
        *	Organization \n \n
        FHIR Resource: Location \n
        * Location \n"
      parameters:
        - $ref: "#/parameters/id"
      responses:
        '200':
          description: Success
          schema:
            $ref: "#/definitions/Organization"
        '404':
          $ref: "#/responses/ResourceNotFound404"
        '401':
          $ref: "#/responses/ResourceNotAuthorized401"
  "/fhir/r4/Provenance/{id}":
    get:
      tags:
        - Provenance
      description: "Fetches Provenance by id. Provenance of a resource is a record that describes entities and processes involved in producing and delivering or otherwise influencing that resource.  \n \n
        FHIR Resource: Provenance.recorded \n
        *	Author Time Stamp \n \n
        FHIR Resource: Provenance.agent \n"
      parameters:
        - $ref: "#/parameters/id"
      responses:
        '200':
          description: Success
          schema:
            $ref: "#/definitions/Provenance"
        '404':
          $ref: "#/responses/ResourceNotFound404"
        '401':
          $ref: "#/responses/ResourceNotAuthorized401"
  "/fhir/r4/Specimen/{id}":
    get:
      tags:
        - Specimen
      description: |
        Fetches a single Specimen by ID.

        FHIR Resource: [Specimen](http://hl7.org/fhir/R4/specimen.html)
        * Retrieves a specific Specimen resource by its logical ID.
      parameters:
        - name: id
          in: path
          required: true
          type: string
          description: The ID of the Specimen resource
      responses:
        '200':
          description: Success - Returns the Specimen resource.
          schema:
            $ref: "#/definitions/Specimen"
        '404':
          $ref: "#/responses/ResourceNotFound404"
        '401':
          $ref: "#/responses/ResourceNotAuthorized401"
  "/fhir/r4/Specimen":
    get:
      tags:
        - Specimen
      description: |
        Fetches a Bundle containing Specimen resources.
        
        Supports filtering by patient or _id. If neither parameter is provided, the server will return a 400 Bad Request.
        
        FHIR Resource: [Specimen](http://hl7.org/fhir/R4/specimen.html)
      parameters:
        - name: _id
          in: query
          required: false
          type: string
          description: Search by Specimen logical ID
        - name: patient
          in: query
          required: false
          type: string
          description: Search by Patient reference (e.g., patient ID)
      responses:
        '200':
          description: Success - Returns a Bundle of Specimen resources.
          schema:
            $ref: "#/definitions/SpecimenBundled"
        '400':
          description: |
            **Invalid request:** The following conditions will result in a `400 Bad Request`:
            
            - `_id` and `patient` cannot be provided together.
            - Neither `_id` nor `patient` is provided.
        '404':
          $ref: "#/responses/ResourceNotFound404"
        '401':
          $ref: "#/responses/ResourceNotAuthorized401"
  "/fhir/r4/RelatedPerson/{id}":
    get:
      tags:
        - RelatedPerson
      description: "Fetches a Related Person by id.  \n \n
              FHIR Resource: RelatedPerson \n
              *	Related Person \n"
      parameters:
        - $ref: "#/parameters/id"
      responses:
        '200':
          description: Success
          schema:
            $ref: "#/definitions/RelatedPerson"
        '404':
          $ref: "#/responses/ResourceNotFound404"
        '401':
          $ref: "#/responses/ResourceNotAuthorized401"
  "/fhir/r4/RelatedPerson":
      get:
        tags:
          - RelatedPerson
        description: "Fetches a bundled resource containing RelatedPerson data based on the provided parameters.\n\n
                - If `patient_id` is provided, a bundle containing a related persons is returned.\n\n
            FHIR Resource: Related Person \n
          *	Related Person \n"
        parameters:
          - $ref: "#/parameters/patient_id"
        responses:
          '200':
            description: success
            schema:
              $ref: "#/definitions/RelatedPersonBundled"
          '404':
            $ref: "#/responses/ResourceNotFound404"
          '401':
            $ref: "#/responses/ResourceNotAuthorized401"
  "/fhir/r4/Coverage/{id}":
    get:
      tags:
        - Coverage
      description: "Fetches a Coverage by id.  \n \n
                    FHIR Resource: Coverage \n
                    * Coverage resource represents insurance coverage details for a patient \n"
      parameters:
        - $ref: "#/parameters/id"
      responses:
        '200':
          description: Success
          schema:
            $ref: "#/definitions/Coverage"
        '404':
          $ref: "#/responses/ResourceNotFound404"
        '401':
          $ref: "#/responses/ResourceNotAuthorized401"
  "/fhir/r4/Coverage":
    get:
      tags:
        - Coverage
      description: "Fetches a bundled resource containing Coverage data based on the provided parameters.\n\n
                    - If `patient` is provided, a bundle containing the coverages is returned.\n\n
                    FHIR Resource: Coverage \n
                    * Coverage resource represents insurance coverage details for a patient \n"
      parameters:
        - $ref: "#/parameters/patient_id"
      responses:
        '200':
          description: success
          schema:
            $ref: "#/definitions/CoverageBundled"
        '404':
          $ref: "#/responses/ResourceNotFound404"
        '401':
          $ref: "#/responses/ResourceNotAuthorized401"
  '/ccda':
    get:
      tags:
        - CCDA
      description:  Fetches a resource containing details of the Patient in CCDA format
      parameters:
        - $ref: "#/parameters/patient_id"
        - $ref: "#/parameters/date"
      produces:
        - text/xml
      responses:
        '200':
          $ref: "#/responses/Success200"
        '404':
          $ref: "#/responses/ResourceNotFound404"
        '401':
          $ref: "#/responses/ResourceNotAuthorized401"

securityDefinitions:
  OauthSecurity:
    description: Access code based oauth authentication
    type: oauth2
    flow: accessCode
    authorizationUrl: "https://idp-prod.prod.ngo.nextgenaws.net/auth/realms/nextgen/protocol/openid-connect/auth?aud=https://fhir.meditouchehr.com/api/fhir/r4"
    tokenUrl: "https://idp-prod.prod.ngo.nextgenaws.net/auth/realms/nextgen/protocol/openid-connect/token"
    scopes:
      openid: Open ID scope
      launch/patient: Used by clients to request a patient-scoped access token
      offline_access: Request a refresh_token that can be used to obtain a new access token to replace an expired one, and that will be usable for as long as the end-user remains online.
      patient/*.read: Read access to all Patient Resources

security:
  - OauthSecurity:
      - "patient/*.read"

parameters:
  id:
    description: The id of the resource
    name: "id"
    in: "path"
    required: true
    type: string
  _id:
    description: The id of the resource
    name: "_id"
    in: query
    required: false
    type: string
  date:
    description: A date parameter searches on a date/time or period. The only supported prefixes are - gt, lt, ge, le, eq. Example-gt2015-01-15. See https://www.hl7.org/fhir/R4/search.html#date.
    name: "date"
    in: query
    type: string
  patient_identifier:
    description: A patient identifier
    name: "identifier"
    in: query
    required: false
    type: string
  patient_name:
    description: Name of the patient
    name: "name"
    in: query
    required: false
    type: string
  patient_birthdate:
    description: Date of birth of the patient.The format is YYYY-MM-DD e.g. 1905-08-23.There shall be no time zone.Dates shall be valid dates. See https://www.hl7.org/fhir/R4/search.html#birthDate.
    name: "birthdate"
    in: query
    required: false
    type: string
  patient_gender:
    description: Gender of the patient. Supported values male | female | undifferentiated | both. See http://hl7.org/fhir/R4/valueset-administrative-gender.html
    name: "gender"
    in: query
    required: false
    type: string
  patient_id:
    description: The id of the patient
    name: "patient"
    in: query
    required: true
    type: string
  optional_patient_id:
    description: The id of the patient
    name: "patient"
    in: query
    required: false
    type: string
  doc_ref_type:
    description: Kind of document (LOINC if possible). See http://hl7.org/fhir/R4/valueset-c80-doc-typecodes.html
    name: "type"
    in: query
    required: false
    type: string
  doc_ref_category:
    description: Categorization of document. Only clinical-note category supported. See http://hl7.org/fhir/R4/valueset-document-classcodes.html
    name: "category"
    in: query
    required: false
    type: string
  doc_ref_date:
    description: When this document reference was created.A date parameter searches on a date/time or period. The only supported prefixes are - gt, lt, ge, le, eq. Example-gt2015-01-15. See https://www.hl7.org/fhir/search.html#date.
    name: "date"
    in: query
    required: false
    type: string
  doc_ref_status:
    description: Supported values current | superseded | entered-in-error. See http://hl7.org/fhir/R4/valueset-document-reference-status.html
    name: "status"
    in: query
    required: false
    type: string
  encounter_id:
    description: The id of the resource with prefix values PT with hyphen.Example PT-123
    name: "id"
    in: "path"
    required: true
    type: string
  condition_id:
    description: The id of the resource with prefix values PL | HC | ED with hyphen.Example PL-123
    name: "id"
    in: "path"
    required: true
    type: string
  condition_category:
    description: The category of the condition. See http://hl7.org/fhir/R4/valueset-condition-category.html
    name: "category"
    in: query
    required: false
    type: string
  observation_id:
    description: The id of the resource with prefix values HX | VS | LR with hyphen.Example HX-123
    name: "id"
    in: "path"
    required: true
    type: string
  observation_category:
    description: The category of the observation. See http://hl7.org/fhir/R4/valueset-observation-category.html
    name: "category"
    in: query
    required: false
    type: string
  observation_code:
    description: The LOINC code of the observation. The only supported code at this time is "72166-2" which is for smoking status. See http://hl7.org/fhir/R4/valueset-observation-codes.html
    name: "code"
    in: query
    required: false
    type: string
  mr_status:
    description: Status of the prescription. See http://hl7.org/fhir/CodeSystem/medicationrequest-status
    name: "status"
    in: query
    required: false
    type: string
  mr_intent:
    description: Returns prescriptions with different intents. See http://hl7.org/fhir/R4/valueset-medicationrequest-intent.html
    name: "intent"
    in: query
    required: false
    type: string
  ma_status:
    description: Status of the medication administration. See http://hl7.org/fhir/R4/valueset-medication-admin-status.html
    name: "status"
    in: query
    required: false
    type: string
  dr_category:
    description: Which diagnostic discipline/department created the report. See http://hl7.org/fhir/R4/valueset-diagnostic-service-sections.html
    name: "category"
    in: query
    required: false
    type: string
  dr_code:
    description: The code for the report, as opposed to codes for the atomic results, which are the names on the observation resource referred to from the result. See http://hl7.org/fhir/R4/valueset-diagnostic-service-sections.html
    name: "code"
    in: query
    required: false
    type: string
  cp_category:
    description: Type of plan. See http://hl7.org/fhir/R4/valueset-care-plan-category.html
    name: "category"
    in: query
    required: true
    type: string
  ct_status:
    description: Supported Values proposed | active | suspended | inactive | entered-in-error. See http://hl7.org/fhir/R4/valueset-care-team-status.html
    name: "status"
    in: query
    required: false
    type: string
  patient:
    description: The id of the patient
    name: "patient"
    in: query
    required: true
    type: string
  status:
      description: Status of the medication dispense
      name: "status"
      in: query
      required: false
      type: string
  practitioner_id:
    description: The id of the practitioner
    name: "practitioner"
    in: query
    required: true
    type: string

responses:
  Success200:
    description: Success
  ResourceNotFound404:
    description: Resource not found
  ResourceNotAuthorized401:
    description: Resource not authorized to be viewed by this user

definitions:
  Condition:
    type: object
    properties:
      resourceType:
        type: string
        minLength: 1
      id:
        type: string
        minLength: 1
        description: id of the resource
      meta:
        type: object
        description: Metadata about the resource
        properties:
          profile:
            description: Profiles this resource claims to conform to
            type: array
            items:
              type: string
        required:
          - profile
      clinicalStatus:
        type: object
        properties:
          coding:
            type: array
            items:
              type: object
              properties:
                system:
                  type: string
                  minLength: 1
                  description: Symbol in syntax defined by the system
                code:
                  type: string
                  minLength: 1
                  description: Symbol in syntax defined by the system
                display:
                  type: string
                  minLength: 1
                  description: Representation defined by the system
              required:
                - display
                - system
            description: Code defined by a terminology system
          text:
            type: string
            minLength: 1
            description: Plain text representation of the concept
        required:
          - coding
          - text

      verificationStatus:
        type: object
        properties:
          coding:
            type: array
            items:
              type: object
              properties:
                system:
                  type: string
                  minLength: 1
                  description: Symbol in syntax defined by the system
                code:
                  type: string
                  minLength: 1
                  description: Symbol in syntax defined by the system
                display:
                  type: string
                  minLength: 1
                  description: Representation defined by the system
              required:
                - display
                - system
            description: Code defined by a terminology system
          text:
            type: string
            minLength: 1
            description: Plain text representation of the concept
        required:
          - coding
          - text

      category:
        type: array
        items:
          type: object
          properties:
            coding:
              type: array
              items:
                type: object
                properties:
                  system:
                    type: string
                    minLength: 1
                    description: Symbol in syntax defined by the system
                  code:
                    type: string
                    minLength: 1
                    description: Symbol in syntax defined by the system
                  display:
                    type: string
                    minLength: 1
                    description: Representation defined by the system
                required:
                  - display
                  - system
              description: Code defined by a terminology system
            text:
              type: string
              minLength: 1
              description: Plain text representation of the concept
          required:
            - coding
            - text

      code:
        type: object
        properties:
          coding:
            type: array
            items:
              type: object
              properties:
                system:
                  type: string
                  minLength: 1
                  description: Symbol in syntax defined by the system
                code:
                  type: string
                  minLength: 1
                  description: Symbol in syntax defined by the system
                display:
                  type: string
                  minLength: 1
                  description: Representation defined by the system
              required:
                - display
                - system
            description: Code defined by a terminology system
          text:
            type: string
            minLength: 1
            description: Plain text representation of the concept
        required:
          - coding
          - text

      subject:
        type: object
        properties:
          reference:
            type: string
            minLength: 1
            description: Literal reference, Relative, internal or absolute URL
          display:
            type: string
            minLength: 1
            description: Text alternative for the resource
        required:
          - reference
      encounter:
        type: object
        properties:
          reference:
            type: string
            minLength: 1
            description: Literal reference, Relative, internal or absolute URL
          display:
            type: string
            minLength: 1
            description: Text alternative for the resource
        required:
          - reference
      onsetDateTime:
        type: string
        minLength: 1
        description: Date in format - YYYY-MM-DDThh:mm:ss+zz
    required:
      - resourceType
      - id
      - meta
      - clinicalStatus
      - verificationStatus
      - category
      - code
      - subject
      - onsetDateTime
  ConditionBundled:
    type: object
    properties:
      resourceType:
        type: string
        minLength: 1
      id:
        type: string
        minLength: 1
        description: id of the resource
      meta:
        type: object
        description: Metadata about the resource
        properties:
          profile:
            description: Profiles this resource claims to conform to
            type: array
            items:
              type: string
        required:
          - profile
      type:
        type: string
        minLength: 1
        description: Type of Search
      total:
        type: integer
        description: Number of Consitions in entry field
      link:
        type: object
        properties:
          relation:
            type: string
            minLength: 1
            description: relation of the resource with link provided in url
          url:
            type: string
            minLength: 1
            description: FHIR URI of the request
