- aid: nextgen-healthcare:nextgen-enterprise-patient-access-fhir-api
  name: NextGen Enterprise Patient Access FHIR API
  description: >-
    HL7 FHIR API for the NextGen Enterprise EHR, certified under the 21st Century Cures Act Patient Access
    criteria, exposing USCDI data to patient-facing apps. Available in FHIR R4 (4.0.1) and legacy DSTU2,
    authenticated with SMART-on-FHIR OAuth2 authorization-code flow. The live R4 CapabilityStatement advertises
    28 US Core resource types.
  humanURL: https://www.nextgen.com/api/nge-fhir-r4
