- name: NextGen Office Patient FHIR API
  description: >
    FHIR R4-based Patient Access API for NextGen Office (formerly MediTouch) ambulatory practices. Enables
    patients and authorized apps to access personal health information via the YourHealthFile patient
    access platform. Implements HL7 FHIR R4 and DSTU2 standards. Compliant with 21st Century Cures Act
    interoperability requirements and supports USCDI v1 data elements including clinical notes, lab results,
    medications, allergies, immunizations, and patient demographics.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: >-
    https://www.nextgen.com/api/-/media/files/ngo/nextgen-office-fhir-patient-api-developer-guide
  baseURL: https://fhir.meditouchehr.com
  tags:
  - FHIR R4
  - NextGen Office
  - Patient Access
  - YourHealthFile
  - 21st Century Cures
  properties:
  - type: Documentation
    url: >-
      https://www.nextgen.com/api/-/media/files/ngo/nextgen-office-fhir-patient-api-developer-guide
- name: NextGen Office SMART App Launch FHIR API
  description: >
    SMART on FHIR App Launch API for NextGen Office enabling vendor applications to obtain USCDIv1 clinical
    data for a single patient. Compliant with 21st Century Cures Act requirements. Supports HL7 SMART
    App Launch framework for EHR-integrated application launches with OAuth 2.0 authorization code flow.
    Enables clinical decision support apps, patient-facing applications, and provider workflow tools to
    securely access patient data within the NextGen Office context.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: >-
    https://www.nextgen.com/api/-/media/files/ngo/nextgen-office-fhir-r4-smart-app-launch-api-developer-guide
  baseURL: https://fhir.meditouchehr.com
  tags:
  - SMART on FHIR
  - App Launch
  - FHIR R4
  - 21st Century Cures
  - Single Patient
  properties:
  - type: Documentation
    url: >-
      https://www.nextgen.com/api/-/media/files/ngo/nextgen-office-fhir-r4-smart-app-launch-api-developer-guide
- name: NextGen Office Bulk FHIR API
  description: >
    Bulk FHIR API for NextGen Office enabling authorized vendors to obtain USCDIv1 data for multiple patients
    in a group using the HL7 FHIR Bulk Data Access specification. Compliant with 21st Century Cures Act
    requirements. Supports asynchronous bulk export patterns with kick-off, status polling, and download
    steps. Base URL is https://fhir.meditouchehr.com/api/bulkfhir/r4. Includes Patient Search API for
    identifying active patients to include in export groups. Uses SMART Backend Services authorization
    for system-to-system authentication.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: >-
    https://www.nextgen.com/-/media/files/ngo/NextGen-Office-FHIR-R4-Bulk-FHIR-API-Developer-Guide
  baseURL: https://fhir.meditouchehr.com/api/bulkfhir/r4
  tags:
  - Bulk FHIR
  - FHIR R4
  - Multi-Patient
  - 21st Century Cures
  - USCDI
  properties:
  - type: Documentation
    url: >-
      https://www.nextgen.com/-/media/files/ngo/NextGen-Office-FHIR-R4-Bulk-FHIR-API-Developer-Guide
- name: NextGen Mirth Connect Integration Engine API
  description: >
    API for NextGen Mirth Connect, an open-source healthcare integration engine supporting HL7 v2, FHIR,
    and other healthcare data standards for interoperability between clinical systems. Enables message
    transformation, routing, and exchange across disparate healthcare IT systems. Available as self-hosted
    open-source software via GitHub or as Mirth Fully Managed, a cloud-native SaaS platform for healthcare
    data exchange.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.nextgen.com/solutions/interoperability/api-fhir
