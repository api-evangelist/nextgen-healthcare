- aid: nextgen-healthcare:nextgen-office-fhir-r4-api
  name: NextGen Office FHIR R4 API
  description: >-
    HL7 FHIR R4 (4.0.1) Patient Access API for the cloud-based NextGen Office (formerly
    MediTouch) EHR, coded against the US Core specification and exposing read-only USCDIv1 data.
    A downloadable Swagger 2.0 definition (45 paths) is published, and the live R4
    CapabilityStatement advertises 26 US Core resource types. Authenticated with SMART App
    Launch / OpenID Connect OAuth2 via Keycloak.
  humanURL: https://www.nextgen.com/api/regulatory-ngo
  baseURL: https://fhir.meditouchehr.com/api/fhir/r4
