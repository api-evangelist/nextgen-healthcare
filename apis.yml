name: NextGen Healthcare
kind: company
description: >-
  NextGen Healthcare is a United States ambulatory electronic health record (EHR/EMR) and
  practice-management vendor headquartered in Remote-first / Atlanta, Georgia, serving
  outpatient specialties and community health with its NextGen Enterprise and NextGen Office
  platforms plus the Mirth Connect interoperability engine. Its developer surface is
  standards-driven: 21st Century Cures Act-certified HL7 FHIR APIs for patient access and
  provider apps, a SMART App Launch API, and a Bulk FHIR (Flat FHIR) API delivering USCDI
  data, alongside an 800+ route JSON RESTful Enterprise API family. NextGen Enterprise exposes
  live FHIR R4 and DSTU2 service base URLs with SMART-on-FHIR OAuth2, and NextGen Office exposes
  live FHIR R3/R4 and Bulk FHIR endpoints. FHIR resources are coded against the US Core /
  USCDIv1 implementation guides. Developer onboarding is gated behind an API onboarding form and
  app registration, which is standard for regulated health-data access in the US market.
