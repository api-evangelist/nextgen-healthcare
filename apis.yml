  name: NextGen Enterprise Patient Access FHIR API
  description: >-
    HL7 FHIR API for the NextGen Enterprise EHR, certified under the 21st Century Cures Act
    Patient Access criteria, exposing USCDI data to patient-facing apps. Available in FHIR R4
