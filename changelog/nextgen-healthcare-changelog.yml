description: >-
  The only dated, publicly readable NextGen Healthcare release channel is the GitHub Releases feed
  for Mirth Connect (NextGen Connect), the open-source integration engine. Each release carries a
  semantic version, a publication date, and links to a "What's New", "Upgrade Guide" and
  "Release Notes" wiki page. The NextGen Enterprise, NextGen Office, FHIR Patient Access and Bulk
  FHIR API surfaces publish no public changelog: their release notes sit behind the NextGen Success
  Community login (community.nextgen.com), so API consumers cannot read version history without a
  customer account. FHIR version movement is instead expressed as new service base URLs
  (fhir/dstu2 -> fhir/ (STU3) -> fhir/r4).
