description: >-
  First-party software NextGen Healthcare publishes. NextGen ships NO client SDK for its FHIR or
  NextGen Enterprise REST APIs on any public package registry — npm, PyPI, Maven Central, NuGet,
  RubyGems, Packagist and crates.io all miss for a first-party NextGen FHIR/Enterprise client, and
  the developer guides instruct integrators to call the endpoints with curl or Postman directly.
  What NextGen does publish as software is Mirth Connect (NextGen Connect), the open-source
  healthcare integration engine, distributed as GitHub releases and official Docker images, plus a
  small set of Go/Terraform libraries for THIRD-PARTY cloud-ops APIs (CloudHealth, Sumo Logic) that
  are not clients for any NextGen API. Currency is recorded as structured version/published fields
  below: the flagship product's last tagged release is 4.5.2 (2024-09-23) and the Go/Terraform
  libraries have not been released since 2019-2020.
